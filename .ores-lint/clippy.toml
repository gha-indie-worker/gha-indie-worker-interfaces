# Canonical copy: .ores-lint/clippy.toml. Kept in sync by .ores-lint/lint.sh.
#
# This crate is data-only: the types are wide by design (a contract model has as
# many fields as the authorities say it has), so the struct-field thresholds are
# raised rather than fought.
too-many-arguments-threshold = 12
type-complexity-threshold = 500

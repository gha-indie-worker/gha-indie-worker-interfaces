name: contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - name: TypeSpec compiles
        run: npm run lint:typespec
      - name: TypeSpec + JSON Schema projection parity, every slice
        run: node scripts/contracts-slices.mjs check
      - name: TypeSpec + JSON Schema semantic parity, recorded corpus, and Contract IR (TJSV)
        run: npm run contracts:tjsv
      - name: generated/ is up to date (run `npm run contracts:generate` and commit)
        run: node scripts/contracts-slices.mjs generate && git diff --exit-code -- generated
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ores-contracts-receipts
          path: target/ores-contracts/*/receipt.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tjsv-language-boundary-evidence
          path: |
            .typespec-json-schema-validator/reports/*.json
            .typespec-json-schema-validator/contract-ir/*.json
            .typespec-json-schema-validator/generated/**/*.json
            .typespec-json-schema-validator/mappings/*.json
          if-no-files-found: ignore

  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - name: Fixtures — dependency-free validator
        run: npm run validate:fixtures:builtin
      - name: Fixtures — ajv 2020-12
        run: node scripts/validate-fixtures.mjs --engine ajv

  rust-witness:
    needs: parity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci && node scripts/contracts-slices.mjs generate
      - name: serde types + SeaORM entities + Diesel schema compile together
        run: |
          set -euo pipefail
          witness=node_modules/@oresoftware/ores-contracts/scripts/rust-witness.sh
          if [ ! -x "$witness" ]; then
            echo "ores-contracts did not ship its rust witness script; skipping"
            exit 0
          fi
          for slice in $(node -e 'process.stdout.write(require("./contracts.config.json").slices.join(" "))'); do
            echo "== $slice"
            "$witness" "generated/$slice"
          done

  db-witness:
    needs: parity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - name: Apply SQL_T and SQL_J to separate schemas and diff pg catalogs
        run: |
          set -euo pipefail
          for cfg in contracts/config/*.config.json; do
            echo "== $cfg"
            npx ores-contracts db-check --config "$cfg" \
              --database-url postgresql://postgres:postgres@localhost:5432/postgres
          done

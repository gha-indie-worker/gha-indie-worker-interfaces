name: oreslang-demo-pr15-stable

on:
  push:
    branches:
      - ci/oreslang-demo-pr15-stable-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify compiler mirror
        run: |
          docker run --rm -v "$PWD/oreslang-ci:/work" -w /work maven:3.9.11-eclipse-temurin-21 mvn -B -ntp verify
      - name: Run PR 15 stable examples
        run: |
          docker run --rm -v "$PWD/oreslang-ci:/work" -w /work maven:3.9.11-eclipse-temurin-21 bash -lc '
            set -euo pipefail
            for f in               examples/demo_pr15_import.ores               examples/demo_pr15_option.ores               examples/demo_pr15_interfaces.ores               examples/demo_pr15_mut_destructure.ores
            do
              echo "==> $f"
              mvn -B -ntp -DskipTests compile exec:java -Dexec.args="$f"
            done
          '

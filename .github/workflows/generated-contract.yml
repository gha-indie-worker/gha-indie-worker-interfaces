name: generated-contract

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Runtime generated contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install jsonschema
        run: python3 -m pip install --quiet jsonschema
      - name: Check generated policy, freeze bits, and JSON Schema runtime
        run: python3 scripts/check-generated-contract.py --freeze --require-readonly
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test exact mirrored Oreslang actor guest lane and warmup
        run: |
          cd mirror/oreslang
          mvn -B -P '!native-thread-unix' -Dores.runtime.carriers=java -Dtest=OresVMTest,SerialProcessExecutorTest,ProcessTurnTraceTest,ProcessTimerServiceTest,RootEventLoopRefinementTest,ActorAffinityDispatcherTest,SharedActorSingleFlightContractTest,ActorCallableValueBoundaryTest,PointerlessFncOwnershipTest,ActorImmutableSharedTransportTest,ActorCallableValueBoundaryTest,PointerlessFncOwnershipTest,ActorImmutableSharedTransportTest,ActorSharedCodeImageWhitelistTest,SharedCodeImageStoreTest,ActorModuleStateOwnershipTest,ModuleFieldOwnershipTest test

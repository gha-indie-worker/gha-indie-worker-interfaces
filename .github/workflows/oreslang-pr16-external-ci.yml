name: oreslang-pr16-external-ci

on:
  push:
    branches:
      - ci/oreslang-pr16
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Oreslang mirror in JDK 21 Maven container
        run: |
          docker run --rm \
            -v "$PWD/oreslang-ci:/work" \
            -w /work \
            maven:3.9.11-eclipse-temurin-21 \
            mvn -B -ntp verify

      - name: Run new Oreslang demo examples
        run: |
          docker run --rm \
            -v "$PWD/oreslang-ci:/work" \
            -w /work \
            maven:3.9.11-eclipse-temurin-21 \
            bash -lc '
              set -euo pipefail
              for example in \
                examples/05_defer_lifo.ores \
                examples/06_defer_producers.ores \
                examples/07_break_continue.ores \
                examples/08_loop_cleanup.ores
              do
                echo "==> $example"
                mvn -B -ntp -DskipTests compile exec:java -Dexec.args="$example"
              done
            '

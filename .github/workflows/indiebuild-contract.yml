name: IndieBuild config product contract parity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact contract and fixture source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compare independent indiebuild TypeSpec and Draft 2020-12 Schema A
        uses: ORESoftware/typespec-json-schema-validator@eb669d2c2c4f0800fac54f9b5a306b550121f1ac
        with:
          typespec: contracts/indiebuild.tsp
          schema: contracts/indiebuild.schema.json
          instances: contracts/indiebuild-instances
          report: .typespec-json-schema-validator/indiebuild/report.json
          sarif: .typespec-json-schema-validator/indiebuild/report.sarif
          contract_ir: .typespec-json-schema-validator/indiebuild/contract-ir.json
          output_dir: .typespec-json-schema-validator/indiebuild/generated
          max_probes: "96"
          int64_strategy: string
          seal_object_schemas: "true"
          polymorphic_models_strategy: oneOf
      - name: Verify fresh full-scope Contract IR and seven canonical refusals
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@eb669d2c2c4f0800fac54f9b5a306b550121f1ac
        with:
          contract_ir: .typespec-json-schema-validator/indiebuild/contract-ir.json
          report: .typespec-json-schema-validator/indiebuild/report.json
          typespec: contracts/indiebuild.tsp
          schema: contracts/indiebuild.schema.json
          generated_schema: .typespec-json-schema-validator/indiebuild/generated/typespec.generated.schema.json
          expected_declarations: '["GhaIndieWorker.IndieBuildRepositoryRole","GhaIndieWorker.IndieBuildTargetRole","GhaIndieWorker.IndieBuildPlatform","GhaIndieWorker.IndieBuildTarget","GhaIndieWorker.IndieBuildConfig"]'
          verification: .typespec-json-schema-validator/indiebuild/verification.json
      - name: Confirm both human-authored authorities remain unchanged
        run: git diff --exit-code -- contracts/indiebuild.tsp contracts/indiebuild.schema.json
      - name: Preserve contract IR, report, differential and negative receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: indiebuild-contract-head-${{ github.run_id }}
          path: .typespec-json-schema-validator/indiebuild/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

name: route-map-sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gha-indie-worker/gha-indie-worker-lib-core
          path: .deps/gha-indie-worker-lib-core
          persist-credentials: false
      - name: Expose checker-compatible sibling path
        run: ln -s "$GITHUB_WORKSPACE/.deps/gha-indie-worker-lib-core" "$GITHUB_WORKSPACE/../gha-indie-worker-lib-core"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      # No pip install: the checker and generator are standard library only, so
      # CI and a developer laptop cannot reach different verdicts.
      - name: Validate the route maps and the generated clients
        run: python3 scripts/check-route-sync.py --root .

name: Oreslang Rust single-flight model mirror
on:
  push:
    branches:
      - 'test/oreslang-single-flight-20261009'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test exact mirrored Oreslang process-turn model
        run: cargo test --manifest-path formal/process-turns/Cargo.toml -- --nocapture

name: oreslang-pr49-fixed-exact-head

on:
  push:
    branches: ["ci/oreslang-pr49-fixed"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Checkout exact PR head
        shell: bash
        run: |
          set -euo pipefail
          sha=2993a6fc5941ec233bb97bcf3d8a7e0e281ef9ff
          git clone --quiet https://github.com/ores-truffle-oreslang/oreslang-source.java.git "$RUNNER_TEMP/oreslang-source.java"
          git -C "$RUNNER_TEMP/oreslang-source.java" checkout --quiet --detach "$sha"
          test "$(git -C "$RUNNER_TEMP/oreslang-source.java" rev-parse HEAD)" = "$sha"
      - name: Full Maven verification
        shell: bash
        run: mvn -B -ntp -f "$RUNNER_TEMP/oreslang-source.java/pom.xml" verify

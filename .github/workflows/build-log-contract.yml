name: Build log contract parity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out contract authorities
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out immutable TJSV verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: e609e1973fcdcfaeecbdfa2dcbfde75c55286ff7
          path: .tjsv
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.11.0'
          package-manager-cache: false

      - name: Audit TJSV production dependencies
        working-directory: .tjsv
        env:
          TSJSV_NPM_AUDIT_RECEIPT: ${{ runner.temp }}/tjsv-npm-audit-receipt.json
        run: node ./scripts/npm-audit-gate.mjs

      - name: Install TJSV lockfile-pinned toolchain
        working-directory: .tjsv
        run: npm ci --omit=dev

      - name: Compare independent TypeSpec and JSON Schema authorities
        run: |
          set -euo pipefail
          node .tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec=contracts/build-log.tsp \
            --schema=contracts/build-log.schema.json \
            --instances=contracts/instances \
            --report=.typespec-json-schema-validator/report.json \
            --sarif=.typespec-json-schema-validator/report.sarif \
            --contract-ir=.typespec-json-schema-validator/contract-ir.json \
            --output-dir=.typespec-json-schema-validator/generated \
            --max-probes=64 \
            --int64-strategy=string \
            --seal-object-schemas=true \
            --polymorphic-models-strategy=oneOf

      - name: Verify current checked-out inputs before consumption
        env:
          TSJSV_VERIFY_IR: .typespec-json-schema-validator/contract-ir.json
          TSJSV_VERIFY_REPORT: .typespec-json-schema-validator/report.json
          TSJSV_VERIFY_TYPESPEC: contracts/build-log.tsp
          TSJSV_VERIFY_AUTHORED: contracts/build-log.schema.json
          TSJSV_VERIFY_GENERATED: .typespec-json-schema-validator/generated/typespec.generated.schema.json
          TSJSV_VERIFY_DECLARATIONS: '["GhaIndieWorker.BuildLogEvent","GhaIndieWorker.BuildLogMetadata","GhaIndieWorker.BuildLogStream"]'
          TSJSV_VERIFY_VERIFICATION: .typespec-json-schema-validator/consumer-verification.json
        run: node .tjsv/scripts/verify-consumer.mjs

      - name: Retain deterministic contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log-contract-evidence
          path: .typespec-json-schema-validator/
          if-no-files-found: error

  rust-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

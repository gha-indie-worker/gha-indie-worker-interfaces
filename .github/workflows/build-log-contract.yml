name: Build log metadata product contract parity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact contract and fixture source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compare independent build-log TypeSpec and Draft 2020-12 Schema A
        uses: ORESoftware/typespec-json-schema-validator@eb669d2c2c4f0800fac54f9b5a306b550121f1ac
        with:
          typespec: contracts/build-log.tsp
          schema: contracts/build-log.schema.json
          instances: contracts/instances
          report: .typespec-json-schema-validator/build-log/report.json
          sarif: .typespec-json-schema-validator/build-log/report.sarif
          contract_ir: .typespec-json-schema-validator/build-log/contract-ir.json
          output_dir: .typespec-json-schema-validator/build-log/generated
          max_probes: "96"
          int64_strategy: string
          seal_object_schemas: "true"
          polymorphic_models_strategy: oneOf
      - name: Verify fresh full-scope Contract IR and seven canonical refusals
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@eb669d2c2c4f0800fac54f9b5a306b550121f1ac
        with:
          contract_ir: .typespec-json-schema-validator/build-log/contract-ir.json
          report: .typespec-json-schema-validator/build-log/report.json
          typespec: contracts/build-log.tsp
          schema: contracts/build-log.schema.json
          generated_schema: .typespec-json-schema-validator/build-log/generated/typespec.generated.schema.json
          expected_declarations: '["GhaIndieWorker.BuildLogEvent","GhaIndieWorker.BuildLogMetadata","GhaIndieWorker.BuildLogStream"]'
          verification: .typespec-json-schema-validator/build-log/verification.json
      - name: Confirm both human-authored authorities remain unchanged
        run: git diff --exit-code -- contracts/build-log.tsp contracts/build-log.schema.json
      - name: Preserve contract IR, report, differential and negative receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-log-contract-head-${{ github.run_id }}
          path: .typespec-json-schema-validator/build-log/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  rust-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Check only the Rust interface files changed by this contract PR
        run: rustfmt --edition 2021 --config skip_children=true --check src/build_log_metadata.rs src/lib.rs
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

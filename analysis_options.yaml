# Dart lane. `package:lints/recommended.yaml` is the set the Dart team itself
# ships and keeps current, so the fleet tracks upstream instead of curating a
# private list that quietly rots.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # generated/dart is a contract artifact. A type the analyzer cannot resolve
    # means the generator and the contract disagree, which is a gate failure.
    missing_required_param: error
    missing_return: error
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "target/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_single_quotes
    - unawaited_futures
    # Contract types are values: two instances with the same fields are the same
    # thing, and a missing `==` makes a parity test pass for the wrong reason.
    - avoid_equals_and_hash_code_on_mutable_classes

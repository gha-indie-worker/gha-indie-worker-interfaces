# `tsp compile` configuration. The emitted JSON Schema is EVIDENCE, not a source:
# it lands under target/, which is disposable and git-ignored, and it is compared
# against the hand-authored contracts/json-schema/ by scripts/parity.mjs. Nothing
# in this repo consumes it directly, and nothing is ever written back from it.
emit:
  - "@typespec/json-schema"
options:
  "@typespec/json-schema":
    # The emitter only writes types carrying @jsonSchema unless told otherwise; without this
    # it produces an empty $defs and the shape-emitted lane compares nothing against everything.
    emitAllModels: true
    emitter-output-dir: "{project-root}/target/parity/typespec-emitted"
    file-type: json
    bundleId: gha-indie-worker.json
warn-as-error: true
